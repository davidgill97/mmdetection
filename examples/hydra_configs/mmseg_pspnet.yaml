# Example Hydra config for MMSegmentation PSPNet

defaults:
  - base_config
  - _self_

# MM config for PSPNet (example path - adjust to actual mmsegmentation installation)
mm_config: /path/to/mmsegmentation/configs/pspnet/pspnet_r50-d8_4xb2-40k_cityscapes-512x1024.py

# Work directory
work_dir: ./work_dirs/mmseg_pspnet/${now:%Y%m%d_%H%M%S}

# Wandb configuration
wandb:
  project: mmsegmentation
  name: pspnet_cityscapes_${now:%Y%m%d_%H%M%S}
  tags:
    - pspnet
    - cityscapes
    - segmentation
  group: segmentation_experiments

# Training settings
train:
  max_iters: 40000
  val_interval: 4000

# Optimizer settings
optimizer:
  lr: 0.01
  weight_decay: 0.0005

# Data settings
data:
  train_batch_size: 2
  val_batch_size: 1
  num_workers: 2

# Enable AMP for faster training
amp: false

# Launcher for distributed training
launcher: none

# Multi-GPU configuration
# For 4 GPUs with batch_size=2 per GPU: effective batch size = 8
# Adjust learning rate accordingly: lr = 0.01 * (8 / base_batch_size)
