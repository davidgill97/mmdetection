# Example Hydra config for Deformable DETR training on custom dataset

defaults:
  - base_config
  - _self_

# MM config for Deformable DETR
mm_config: ../../configs/neurocle/deformable_detr/deformable_detr_r50_1xb2-15e_mnm.py

# Work directory
work_dir: ./work_dirs/deformable_detr_mnm/${now:%Y%m%d_%H%M%S}

# Wandb configuration
wandb:
  project: neurocle
  name: deformable_detr_mnm_${now:%Y%m%d_%H%M%S}
  tags:
    - deformable_detr
    - mnm
    - detection
  group: deformable_detr_experiments

# Training settings
train:
  max_epochs: 15
  val_interval: 1

# Optimizer settings
optimizer:
  lr: 2.0e-4
  weight_decay: 1.0e-4

# Data settings
data:
  train_batch_size: 8
  val_batch_size: 8
  num_workers: 2

# Model settings
model:
  num_classes: 6

# Enable AMP for faster training
amp: false

# Launcher
launcher: none
