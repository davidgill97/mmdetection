# Example search space configuration for Ray Tune hyperparameter optimization
# This file defines the hyperparameters to tune and their ranges

# Learning rate - log uniform distribution between 1e-5 and 1e-3
optim_wrapper.optimizer.lr:
  type: loguniform
  min: 0.00001
  max: 0.001

# Weight decay - log uniform distribution
optim_wrapper.optimizer.weight_decay:
  type: loguniform
  min: 0.000001
  max: 0.001

# Batch size - discrete choices
train_dataloader.batch_size:
  type: choice
  choices: [4, 8, 16, 32]

